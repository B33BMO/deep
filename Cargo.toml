[package]
name = "deep"
version = "0.1.0"
edition = "2024"
description = "A task manager for the terminal: processes, trees, ports, and kill"
repository = "https://github.com/B33BMO/deep"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", default-features = false }
crossterm = "0.29.0"
netstat2 = "0.11.2"
ratatui = "0.30.2"
sysinfo = "0.38.4"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
